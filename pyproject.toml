[project]
name = "aiforme"
version = "0.1.0"
description = "Personal AI layer for my own machine: voice orchestrator, vision agent, finance tracker and security watchdog"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "scikit-learn>=1.9",
]

[project.optional-dependencies]
nlu = [
    "sentence-transformers>=6",
]
voice = [
    "faster-whisper>=1.2 ; sys_platform == 'win32'",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "sounddevice>=0.5 ; sys_platform == 'win32'",
]
train = [
    "onnx>=1.17",
    "onnxscript>=0.7.2",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
