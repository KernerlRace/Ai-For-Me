name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0     # setup-uv publishes no major-version tags
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: uv run --locked ruff check .
      - name: Run tests
        run: uv run --locked pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: aiforme/dashboard/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aiforme/dashboard/web/package-lock.json
      - run: npm ci
      - name: Type-check and build the dashboard
        run: npm run build
